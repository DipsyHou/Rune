[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rune"
version = "0.1.0"
description = "Rune - Natural language control for your PC via direct system API and tool calls."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
rune = "rune.main:main"

[tool.setuptools.packages.find]
include = ["rune*"]
